# Checagens em todo push e pull request: tipos, testes unitários e dependências.
# O empacotamento .wgt e os roteiros na TV precisam do Tizen Studio e da TV, então
# rodam só na máquina de desenvolvimento (ver docs/testes.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
